[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nvidia-tao-sdk"
version = "0.4.0"
description = "NVIDIA TAO Execution SDK — agentic fine-tuning interface for GPU training. Single wheel; platform support is pulled in via extras."
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",   # versions.yaml resolver
]

[project.optional-dependencies]
# Brev handler ships in the wheel and shells out to the brev CLI binary.
# No extra Python deps; this extra exists for naming symmetry and future
# optional Python deps.
brev = []
# Local Docker handler — uses the official docker Python client.
docker = ["docker>=6.0"]
# SLURM handler — SSH-based; stdlib only, no extra Python deps.
slurm = []
# Kubernetes handler — uses the official kubernetes Python client.
kubernetes = ["kubernetes>=28.0"]
# Direct local Python execution; the interpreter itself lives in the user-provided venv.
virtualenv = []
# Optional TOML writer for VirtualEnvSDK config serialization.
toml = ["tomli-w>=1.0"]
# Convenience meta-extra.
all = ["nvidia-tao-sdk[brev,docker,slurm,kubernetes,virtualenv,toml]"]
dev = [
    "nvidia-tao-sdk[all]",
    "pytest>=7.0",
    # Test-only: the in-container runtime helpers (download/upload) use fsspec,
    # and test_script_runner.py patches `fsspec.core.url_to_fs`, which requires
    # the real fsspec module to be importable. fsspec is deliberately NOT a
    # runtime dependency — the container pip-installs it via _DEFAULT_INSTALL_DEPS
    # (see script_runner.py), and build_entrypoint never touches it.
    "fsspec",
    "numpy>=1.24",
    "tomli>=2.0; python_version < '3.11'",
]

[project.entry-points."tao_sdk.platforms"]
brev       = "tao_sdk.platforms.brev:BrevHandler"
docker     = "tao_sdk.platforms.docker:DockerHandler"
slurm      = "tao_sdk.platforms.slurm:SlurmHandler"
kubernetes = "tao_sdk.platforms.kubernetes:KubernetesHandler"

[tool.setuptools.packages.find]
include = ["tao_sdk*"]

[tool.pytest.ini_options]
testpaths = ["tao_sdk/tests"]
